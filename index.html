<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20242b"><meta name="apple-mobile-web-app-capable" content="yes"><title>換你說說看</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#20242b;color:#f4eee5;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 22px 54px;text-align:center;gap:22px}.eyebrow{color:#bfae97;letter-spacing:.22em;font-size:11px}h1{font-size:clamp(28px,8vw,40px);font-weight:500;letter-spacing:.09em;margin:0}p{line-height:1.8;color:#d5d0ca;margin:0}button{border:0;border-radius:100px;background:#d8c2a5;color:#20242b;font-size:18px;padding:17px 29px;min-height:58px;font-weight:600;cursor:pointer}button.secondary{background:#383e47;color:#f4eee5;border:1px solid #69707a}button.danger{background:#6d4145;color:white}button:disabled{opacity:.4}button.small{font-size:14px;min-height:42px;padding:10px 18px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.hidden{display:none!important}.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:86px}.wave span{width:3px;border-radius:3px;background:#c9b296;height:var(--h)}.muted{font-size:13px;color:#aeb0b4}input{border:1px solid #6b6d73;background:#2b3038;border-radius:12px;padding:15px;color:white;font-size:17px;max-width:100%;width:290px}audio{max-width:100%;width:320px}label{display:flex;align-items:center;gap:8px;color:#eee}label input{width:auto}#admin{position:fixed;top:0;right:0;width:70px;height:65px;background:transparent;color:transparent;z-index:10;padding:0}#records{max-height:48vh;overflow:auto;width:min(100%,450px);text-align:left}.record{border-bottom:1px solid #50545d;padding:12px 0;display:grid;gap:10px}.record .actions{justify-content:flex-start}.notice{font-size:12px;color:#b5b7bc;max-width:350px}.error{color:#ffc1c1}#status{min-height:22px} </style></head><body><button id="admin" aria-label="管理員入口">.</button><main><div class="eyebrow">A VOICE EXPERIENCE</div><h1 id="heading">換你說說看。</h1><div id="wave" class="wave" aria-hidden="true"></div><p id="description">有些話，想對你說。</p><div id="player" class="hidden"><audio id="introAudio" controls playsinline></audio></div><div id="recPlayer" class="hidden"><audio id="replyAudio" controls playsinline></audio></div><div id="nameFields" class="hidden"><label><input type="checkbox" id="named">我想留下名字</label><input id="visitorName" maxlength="50" placeholder="你的名字（選填）" class="hidden" autocomplete="off"></div><div id="actions" class="actions"></div><div id="status" class="muted" role="status"></div><div id="adminPanel" class="hidden" style="width:100%;max-width:450px"><p class="muted">錄音只存在這支裝置的網站資料中。請定期匯出備份，清除網站資料可能遺失全部錄音。</p><div class="actions" style="margin:14px"><input type="file" id="introFile" accept="audio/*" style="display:none"><button class="small" id="uploadIntro">設定開場音檔</button><button class="small secondary" id="exportAll">匯出全部 ZIP</button></div><div id="records"></div></div><p class="notice" id="privacy">錄音僅在你確認留下後保存於展場手機。請勿錄入不希望作品管理者聽見的私人資訊。</p></main><script>
const $=id=>document.getElementById(id);let stage='home',stream=null,recorder=null,chunks=[],replyBlob=null,replyURL=null,introURL=null,db=null,adminTaps=0,adminTimer=null,returnTimer=null;const wave=$('wave');for(let i=0;i<35;i++){let s=document.createElement('span');s.style.setProperty('--h',(8+Math.abs(Math.sin(i*.75)*Math.cos(i*.19))*60)+'px');wave.append(s)}
const request=indexedDB.open('voice-exhibit-v2',1);request.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('recordings'))d.createObjectStore('recordings',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};request.onsuccess=e=>{db=e.target.result;showHome()};request.onerror=()=>setStatus('無法啟用本機儲存，請勿用於展出。',true);
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function put(name,value){return new Promise((ok,no)=>{let r=store(name,'readwrite').put(value);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}function get(name,key){return new Promise((ok,no)=>{let r=store(name).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(name){return new Promise((ok,no)=>{let r=store(name).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function remove(name,key){return new Promise((ok,no)=>{let r=store(name,'readwrite').delete(key);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function setStatus(msg='',err=false){$('status').textContent=msg;$('status').className=err?'error':'muted'}function btn(label,fn,kind=''){let b=document.createElement('button');b.textContent=label;if(kind)b.className=kind;b.onclick=fn;$('actions').append(b);return b}function screen(title,desc){clearTimeout(returnTimer);stage='';$('heading').textContent=title;$('description').textContent=desc;$('actions').replaceChildren();$('player').classList.add('hidden');$('recPlayer').classList.add('hidden');$('nameFields').classList.add('hidden');$('adminPanel').classList.add('hidden');$('privacy').classList.remove('hidden');setStatus()}
function stopAudio(){for(let a of [$('introAudio'),$('replyAudio')]){a.pause();a.currentTime=0}}function releaseReply(){if(replyURL)URL.revokeObjectURL(replyURL);replyURL=null;replyBlob=null}async function showHome(){stopAudio();releaseReply();screen('換你說說看。','有些話，想對你說。');stage='home';btn('開始聆聽',playIntro);$('privacy').classList.remove('hidden')}
async function playIntro(){if(!db)return setStatus('儲存系統尚未準備好',true);const s=await get('settings','intro');if(!s){setStatus('展場尚未設定開場音檔，請由管理員先設定。',true);return}screen('請聽我說。','聽完後，換你說說看。');stage='intro';if(introURL)URL.revokeObjectURL(introURL);introURL=URL.createObjectURL(s.blob);$('introAudio').src=introURL;$('player').classList.remove('hidden');$('introAudio').onended=showPrompt;btn('聽完了，繼續',showPrompt,'secondary');try{await $('introAudio').play()}catch(e){setStatus('請按播放器的播放鍵開始聆聽。')}}function showPrompt(){stopAudio();screen('換你說說看。','那你有想對我說什麼呢？');stage='prompt';btn('開始錄音',startRecording);btn('返回首頁',showHome,'secondary')}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){return setStatus('此瀏覽器不支援錄音，請用 Safari HTTPS 網址開啟。',true)}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const supported=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,supported?{mimeType:supported}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{replyBlob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});stream?.getTracks().forEach(t=>t.stop());stream=null;showReview()};recorder.start();screen('正在錄音','請慢慢說，說完再按停止。');stage='recording';btn('停止錄音',()=>{if(recorder?.state==='recording')recorder.stop()});}catch(e){setStatus('無法使用麥克風，請檢查 Safari 麥克風權限。',true)}}function showReview(){screen('留下這段聲音嗎？','可以先聽聽看，再決定是否留下。');stage='review';if(replyURL)URL.revokeObjectURL(replyURL);replyURL=URL.createObjectURL(replyBlob);$('replyAudio').src=replyURL;$('recPlayer').classList.remove('hidden');$('nameFields').classList.remove('hidden');$('named').checked=false;$('visitorName').value='';$('visitorName').classList.add('hidden');btn('確認留下聲音',saveReply);btn('重新錄音',()=>{releaseReply();startRecording()},'secondary');btn('不留下，返回首頁',showHome,'secondary')}
$('named').onchange=()=>{$('visitorName').classList.toggle('hidden',!$('named').checked)};async function saveReply(){if(!replyBlob||!db)return;let name=$('named').checked?$('visitorName').value.trim():'';const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);try{await put('recordings',{id,name:name||'匿名',date:new Date().toISOString(),blob:replyBlob});stopAudio();releaseReply();screen('謝謝你。','謝謝你留下這段聲音。');stage='thanks';btn('返回首頁',showHome,'secondary');setStatus('已保存在這支手機。約 6 秒後返回首頁。');returnTimer=setTimeout(showHome,6000)}catch(e){setStatus('儲存失敗，請通知管理員，暫時不要離開畫面。',true)}}
$('admin').onclick=()=>{adminTaps++;clearTimeout(adminTimer);adminTimer=setTimeout(()=>adminTaps=0,2200);if(adminTaps>=7){adminTaps=0;openAdmin()}};async function hash(text){let data=new TextEncoder().encode(text);let digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')};async function openAdmin(){if(stage==='recording')return;stopAudio();screen('管理員模式','僅供展場管理者使用。');stage='admin-auth';let saved=await get('settings','pin');let input=document.createElement('input');input.type='password';input.inputMode='numeric';input.placeholder=saved?'輸入管理密碼':'首次使用：設定管理密碼';input.autocomplete='off';input.id='pinInput';$('actions').before(input);btn(saved?'進入管理':'設定密碼',async()=>{let pin=input.value;if(pin.length<6){setStatus('請輸入至少 6 位密碼。',true);return}if(saved){if(await hash(pin)!==saved.value){setStatus('密碼不正確',true);return}}else{await put('settings',{key:'pin',value:await hash(pin)})}input.remove();await showAdmin()});btn('返回首頁',()=>{input.remove();showHome()},'secondary')}
async function showAdmin(){screen('錄音管理','只有管理員可以查看與匯出。');stage='admin';$('privacy').classList.add('hidden');$('adminPanel').classList.remove('hidden');btn('結束管理',showHome,'secondary');await refreshRecords()};async function refreshRecords(){const list=(await all('recordings')).sort((a,b)=>b.date.localeCompare(a.date));$('records').replaceChildren();let title=document.createElement('p');title.textContent='已保存 '+list.length+' 段錄音';$('records').append(title);for(const r of list){let wrap=document.createElement('div');wrap.className='record';let meta=document.createElement('div');meta.textContent=r.name+' · '+new Date(r.date).toLocaleString('zh-TW');wrap.append(meta);let audio=document.createElement('audio');audio.controls=true;audio.src=URL.createObjectURL(r.blob);wrap.append(audio);let actions=document.createElement('div');actions.className='actions';let dl=document.createElement('button');dl.className='small';dl.textContent='匯出';dl.onclick=()=>download(r.blob,fileName(r));actions.append(dl);let del=document.createElement('button');del.className='small danger';del.textContent='刪除';del.onclick=async()=>{if(confirm('確定刪除這段錄音？無法復原。')){await remove('recordings',r.id);refreshRecords()}};actions.append(del);wrap.append(actions);$('records').append(wrap)}}function fileName(r){const safe=r.name.replace(/[^\p{L}\p{N}_-]/gu,'_').slice(0,30);return r.date.replace(/[:.]/g,'-')+'_'+safe+(r.blob.type.includes('webm')?'.webm':'.m4a')}function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}$('uploadIntro').onclick=()=>$('introFile').click();$('introFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await put('settings',{key:'intro',blob:f});setStatus('開場音檔已設定。')}catch(err){setStatus('開場音檔儲存失敗',true)}e.target.value=''};
// ZIP writer, stored entries, CRC32; no external libraries or network required.
const enc=new TextEncoder();let crcTable=null;function crc32(bytes){if(!crcTable){crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0})}let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function zip(files){let locals=[],centrals=[],offset=0;for(const f of files){let name=enc.encode(f.name),data=f.data,crc=crc32(data),local=new Uint8Array(30+name.length+data.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);local.set(data,30+name.length);locals.push(local);let central=new Uint8Array(46+name.length),c=new DataView(central.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);central.set(name,46);centrals.push(central);offset+=local.length}const csize=centrals.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,csize,true);v.setUint32(16,offset,true);return new Blob([...locals,...centrals,end],{type:'application/zip'})}
$('exportAll').onclick=async()=>{let records=await all('recordings');if(!records.length){setStatus('目前沒有錄音');return}setStatus('正在準備 ZIP 備份…');try{let files=[];for(const r of records)files.push({name:fileName(r),data:new Uint8Array(await r.blob.arrayBuffer())});download(zip(files),'換你說說看_錄音備份_'+new Date().toISOString().slice(0,10)+'.zip');setStatus('已啟動 ZIP 下載。請到「檔案」App 確認 ZIP 能開啟並播放音檔。')}catch(e){setStatus('備份失敗，請逐筆匯出。',true)}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
